[project]
name = "tether-backend"
version = "1.1.0"
description = "Gateway and detection engine for task-boundary enforcement & behavioural drift monitoring in autonomous AI agents"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "websockets>=12", "pyjwt>=2.8", "cryptography>=42", "numpy>=1.26", "pydantic>=2.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 180
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "B006", "B008"]
ignore = ["F401", "E741"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
