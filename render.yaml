# Render Blueprint: one free web service runs the API, the WebSocket and the built UI.
services:
  - type: web
    name: tether
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn driftward.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - { key: PYTHON_VERSION, value: 3.12.7 }
      - { key: TETHER_ENV, value: production }
      - { key: TETHER_AUTOPILOT, value: "1" }
      - { key: CORS_ORIGINS, value: "*" }
